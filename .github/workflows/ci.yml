name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test the support floor (3.12), the dev interpreter (3.13) and the
        # newest release (3.14).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type-check
        run: uv run pyright src

      - name: Test (with coverage)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pre-commit run --all-files

  package:
    # Catch packaging breaks here rather than at release time: build the
    # artifacts, check their metadata, and import the package from an installed
    # wheel and sdist in environments that never see the source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check artifact metadata
        run: uvx twine check --strict dist/*

      - name: Import from the installed wheel
        run: |
          uv venv --python 3.13 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/python -c "import scikit_opls; print(scikit_opls.__version__)"

      - name: Import from the installed sdist
        run: |
          uv venv --python 3.13 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env/bin/python dist/*.tar.gz
          /tmp/sdist-env/bin/python -c "import scikit_opls; print(scikit_opls.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      # Executing the scripts is the gate: the example gallery must keep working
      # against the current API, not just be committed. The penguins example
      # downloads its dataset from the `data` release tag.
      - name: Run examples
        run: |
          for script in examples/*.py; do
            echo "::group::$script"
            uv run python "$script"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      # The docs build is the gate: it fails on broken refs / config errors.
      - run: uv run zensical build --clean
