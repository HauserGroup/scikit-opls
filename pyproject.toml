[build-system]
# PEP 639 license metadata (SPDX expression + license-files) needs hatchling 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scikit-opls"
dynamic = ["version"]
description = "Orthogonal PLS (OPLS / OPLS-DA) with a scikit-learn interface"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakob S. Madsen", email = "jsmadsen@sund.ku.dk" }]
maintainers = [{ name = "Jakob S. Madsen", email = "jsmadsen@sund.ku.dk" }]
keywords = [
    "opls",
    "opls-da",
    "o2pls",
    "pls",
    "chemometrics",
    "metabolomics",
    "multivariate-analysis",
    "scikit-learn",
]
# No "License ::" classifier: PyPI rejects those alongside a PEP 639 SPDX
# `license` expression.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "joblib>=1.6.0",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "scipy>=1.18.1",
]

[project.urls]
Homepage = "https://github.com/HauserGroup/scikit-opls"
Documentation = "https://hausergroup.github.io/scikit-opls/"
Repository = "https://github.com/HauserGroup/scikit-opls"
"Bug Tracker" = "https://github.com/HauserGroup/scikit-opls/issues"
Changelog = "https://github.com/HauserGroup/scikit-opls/blob/main/CHANGES.md"
"Research Group" = "https://drug.ku.dk/research-sections/pharmaceutical-informatics/pharmacoinformatics/"

[project.optional-dependencies]
# Plotting (scikit_opls.plotting) is the only matplotlib consumer and imports it
# lazily, so it is an opt-in extra: `pip install scikit-opls[plot]`.
plot = ["matplotlib>=3.8.0"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mkdocstrings[python]>=1.0.6",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.6",
    "zensical>=0.0.51",
]

[tool.hatch.version]
path = "src/scikit_opls/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_opls"]

[tool.hatch.build.targets.sdist]
include = [
    "src/scikit_opls",
    "tests",
    "docs",
    "LICENSE",
    "README.md",
    "CHANGES.md",
    "pyproject.toml",
]

[tool.ruff]
# scratch/ is out of scope and never linted.
extend-exclude = ["scratch"]
# Lint/format against the support floor, not the local 3.13 interpreter, so
# pyupgrade-style fixes never introduce 3.13-only syntax.
target-version = "py312"

[tool.ruff.lint]
# Encode the scikit-learn coding guidelines explicitly rather than relying on
# Ruff defaults: pycodestyle (E/W), pyflakes (F, catches `import *`/unused),
# isort (I), pep8-naming (N), pyupgrade (UP), pydocstyle (D, numpy convention).
select = ["E", "W", "F", "I", "N", "UP", "D"]
# N803/N806: scikit-learn convention names the 2-D design matrix `X` (uppercase).
ignore = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests and the package __init__ do not need full numpydoc docstrings.
"tests/**" = ["D"]
"src/scikit_opls/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
# Intra-package imports are absolute (e.g. `from scikit_opls._opls import OPLS`),
# per the scikit-learn developer guide. `known-first-party` keeps the package
# grouped correctly and Ruff's isort enforces ordering.
known-first-party = ["scikit_opls"]

[tool.pytest.ini_options]
# Docstring Examples are executable: doctests run alongside the test suite so
# the numpydoc examples in src/ can never drift from the implementation.
addopts = "--doctest-modules"
testpaths = ["tests", "src/scikit_opls"]

[tool.coverage.run]
source = ["scikit_opls"]
branch = true
omit = ["*/scratch/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "import matplotlib",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
# Type-check against the support floor. We develop on 3.13 locally, but the
# package supports 3.12+, so pin the analysis to catch 3.13-only APIs.
pythonVersion = "3.12"
